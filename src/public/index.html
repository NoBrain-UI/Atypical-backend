<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface2: #181c24;
      --border: #1e2330;
      --border2: #252d40;
      --accent: #3b82f6;
      --accent2: #60a5fa;
      --accent-glow: rgba(59,130,246,0.15);
      --green: #10b981;
      --green-bg: rgba(16,185,129,0.1);
      --amber: #f59e0b;
      --amber-bg: rgba(245,158,11,0.1);
      --red: #ef4444;
      --red-bg: rgba(239,68,68,0.1);
      --purple: #a855f7;
      --purple-bg: rgba(168,85,247,0.1);
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #475569;
      --mono: 'JetBrains Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    body {
      font-family: var(--display);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {}

    .header-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent2);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1;
    }

    h1 span {
      color: var(--accent);
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .live-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--green-bg);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 100px;
      padding: 5px 12px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--green);
      letter-spacing: 1px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--green); }
      50% { opacity: 0.3; box-shadow: none; }
    }

    .counter {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
    }

    #order-count { color: var(--accent2); font-weight: 600; }

    /* ── Stats Row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .stat-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-value.blue { color: var(--accent2); }
    .stat-value.green { color: var(--green); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.red { color: var(--red); }

    /* ── Feed ── */
    #updates {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Order Card ── */
    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      animation: slideDown 0.3s cubic-bezier(0.16,1,0.3,1);
      transition: border-color 0.2s;
    }

    .order-card:hover {
      border-color: var(--border2);
    }

    .order-card.new-flash {
      animation: slideDown 0.3s cubic-bezier(0.16,1,0.3,1), flashBorder 0.8s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px) scale(0.99); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes flashBorder {
      0%   { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
      100% { border-color: var(--border); box-shadow: none; }
    }

    /* Card top bar */
    .card-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .card-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .order-index {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      width: 24px;
    }

    .order-id {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent2);
    }

    .status-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 100px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-badge.new      { background: var(--accent-glow); color: var(--accent2); border: 1px solid rgba(59,130,246,0.3); }
    .status-badge.pending  { background: var(--amber-bg);    color: var(--amber);   border: 1px solid rgba(245,158,11,0.3); }
    .status-badge.complete { background: var(--green-bg);    color: var(--green);   border: 1px solid rgba(16,185,129,0.3); }
    .status-badge.cancel   { background: var(--red-bg);      color: var(--red);     border: 1px solid rgba(239,68,68,0.3); }
    .status-badge.default  { background: var(--surface2);    color: var(--text2);   border: 1px solid var(--border); }

    .card-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-time {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
    }

    .toggle-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      color: var(--text3);
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }

    .toggle-btn:hover {
      border-color: var(--border2);
      color: var(--text2);
    }

    /* Card body — key-value grid */
    .card-body {
      padding: 14px 18px;
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px 20px;
    }

    .kv-item {}

    .kv-key {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .kv-val {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      word-break: break-all;
    }

    /* Raw JSON pre */
    .card-raw {
      display: none;
      border-top: 1px solid var(--border);
    }

    .card-raw.open { display: block; }

    .card-raw pre {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text2);
      padding: 16px 18px;
      overflow-x: auto;
      line-height: 1.7;
      background: var(--surface2);
    }

    /* JSON syntax highlight */
    .json-key    { color: #7dd3fc; }
    .json-str    { color: #86efac; }
    .json-num    { color: #fca5a5; }
    .json-bool   { color: #c4b5fd; }
    .json-null   { color: #94a3b8; }

    /* Empty state */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 0;
      color: var(--text3);
      gap: 12px;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .empty-icon {
      font-size: 36px;
      opacity: 0.4;
    }

    .empty-text {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 22px; }
      .stats-row { grid-template-columns: repeat(2,1fr); }
      .kv-grid { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="header-left">
        <div class="header-eyebrow">// dashboard</div>
        <h1>Real<span>Time</span> Orders</h1>
      </div>
      <div class="header-right">
        <div class="live-chip">
          <div class="live-dot"></div>
          LIVE
        </div>
        <div class="counter"><span id="order-count">0</span> orders received</div>
      </div>
    </header>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total</div>
        <div class="stat-value blue" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value green" id="stat-done">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value amber" id="stat-pending">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cancelled</div>
        <div class="stat-value red" id="stat-cancel">0</div>
      </div>
    </div>

    <div id="updates">
      <div class="empty" id="empty-state">
        <div class="empty-icon">📡</div>
        <div class="empty-text">waiting for socket events...</div>
      </div>
    </div>

  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    let orderCount = 0;
    let statDone = 0, statPending = 0, statCancel = 0;

    function getStatusInfo(data) {
      const s = (data.status || data.state || '').toString().toLowerCase();
      if (s.includes('complet') || s.includes('deliver') || s.includes('done'))
        return { label: data.status || data.state, cls: 'complete' };
      if (s.includes('pend') || s.includes('process') || s.includes('new'))
        return { label: data.status || data.state, cls: 'pending' };
      if (s.includes('cancel'))
        return { label: data.status || data.state, cls: 'cancel' };
      if (s.includes('creat') || s.includes('place'))
        return { label: data.status || data.state, cls: 'new' };
      if (s) return { label: data.status || data.state, cls: 'default' };
      return null;
    }

    function syntaxHighlight(json) {
      return json
        .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function(match) {
          let cls = 'json-num';
          if (/^"/.test(match)) cls = /:$/.test(match) ? 'json-key' : 'json-str';
          else if (/true|false/.test(match)) cls = 'json-bool';
          else if (/null/.test(match)) cls = 'json-null';
          return `<span class="${cls}">${match}</span>`;
        });
    }

    function updateStats(data) {
      const s = (data.status || data.state || '').toString().toLowerCase();
      if (s.includes('complet') || s.includes('deliver') || s.includes('done')) statDone++;
      else if (s.includes('pend') || s.includes('process')) statPending++;
      else if (s.includes('cancel')) statCancel++;
      document.getElementById('stat-total').textContent = orderCount;
      document.getElementById('stat-done').textContent = statDone;
      document.getElementById('stat-pending').textContent = statPending;
      document.getElementById('stat-cancel').textContent = statCancel;
    }

    function addOrderCard(data) {
      orderCount++;
      document.getElementById('order-count').textContent = orderCount;

      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      const statusInfo = getStatusInfo(data);
      const orderId = data.id || data.order_id || data.orderId || '—';
      const now = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const skipKeys = new Set(['id','order_id','orderId','status','state']);
      const kvKeys = Object.keys(data).filter(k => !skipKeys.has(k));

      const kvHTML = kvKeys.map(k => {
        let v = data[k];
        if (typeof v === 'object') v = JSON.stringify(v);
        return `<div class="kv-item"><div class="kv-key">${k}</div><div class="kv-val">${v}</div></div>`;
      }).join('');

      const cardId = 'card-' + orderCount;
      const card = document.createElement('div');
      card.className = 'order-card new-flash';
      card.innerHTML = `
        <div class="card-bar">
          <div class="card-bar-left">
            <span class="order-index">#${orderCount}</span>
            <span class="order-id">${orderId}</span>
            ${statusInfo ? `<span class="status-badge ${statusInfo.cls}">${statusInfo.label}</span>` : ''}
          </div>
          <div class="card-bar-right">
            <span class="card-time">${now}</span>
            <button class="toggle-btn" onclick="toggleRaw('${cardId}', this)">JSON</button>
          </div>
        </div>
        ${kvHTML ? `<div class="card-body"><div class="kv-grid">${kvHTML}</div></div>` : ''}
        <div class="card-raw" id="${cardId}">
          <pre>${syntaxHighlight(JSON.stringify(data, null, 2))}</pre>
        </div>`;

      const feed = document.getElementById('updates');
      feed.insertBefore(card, feed.firstChild);
      updateStats(data);
    }

    function toggleRaw(id, btn) {
      const el = document.getElementById(id);
      const open = el.classList.toggle('open');
      btn.textContent = open ? 'HIDE' : 'JSON';
      btn.style.color = open ? 'var(--accent2)' : '';
      btn.style.borderColor = open ? 'var(--accent)' : '';
    }

    /* ── Socket.IO ── */
    const socket = io("http://localhost:5000");

    socket.on("connect", () => {
      console.log("Connected");
    });

    socket.on("order-update", (data) => {
      console.log(data);
      addOrderCard(data);
    });
  </script>

</body>
</html>
